services:
  - type: web
    name: triathlon-backend
    runtime: python
    autoDeploy: false # déploiement uniquement via deploy hook (gate CI)
    rootDir: backend
    # Le fichier VERSION est lu par `app/version.py` (#134) : `git describe`
    # remonte automatiquement à la racine du dépôt même si le buildCommand
    # tourne depuis `backend/`. `--always` fallback sur le SHA court si aucun
    # tag n'est atteignable — utile pour un déploiement de branche non taggée
    # (preview). `|| echo dev` couvre le cas où git est indisponible au build.
    buildCommand: (git describe --tags --always 2>/dev/null || echo dev) > VERSION && uv sync --frozen --no-dev
    startCommand: uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      # ── Authentification SSO (#114) ────────────────────────────────────────
      # En `sync: false` — secrets, ou valeurs propres à l'environnement — à
      # **deux exceptions près**, chacune commentée ci-dessous : la clé de
      # signature (`generateValue`) et le drapeau de cookie (`value`). Ces trois
      # formes sont exclusives l'une de l'autre chez Render : une entrée porte
      # `sync: false` **ou** une source de valeur, jamais les deux.
      # Une variable absente n'empêche **pas** le démarrage — le site public
      # reste intact et aucun moyen de connexion n'est proposé (FR-036).
      # Valeurs par environnement : docs/ci-cd.md.
      - key: AUTH_SESSION_SECRET_KEY
        # `generateValue` et non `sync: false` : personne n'a besoin de connaître
        # cette clé, et la saisir à la main ferait transiter un secret par un
        # presse-papiers sans rien apporter. Régénérer ne ferme **aucune**
        # session — le jeton de session est opaque et vérifié en base, cette clé
        # ne signe que le jeton d'état (docs/ci-cd.md).
        generateValue: true # ≥ 32 caractères exigés, sinon le démarrage échoue
      - key: AUTH_GITHUB_CLIENT_ID
        sync: false
      - key: AUTH_GITHUB_CLIENT_SECRET
        sync: false
      - key: AUTH_ALLOWED_EMAILS
        sync: false # CSV ; **vide interdit toute connexion**, ce n'est pas « tout le monde »
      - key: AUTH_REDIRECT_BASE_URL
        sync: false # origine de l'**interface** (Vercel), jamais celle de l'API
      - key: AUTH_COOKIE_SECURE
        # Seconde exception : ni secret ni propre à l'instance. Le nom des
        # cookies en **dérive** (`__Host-` exige `Secure`), donc la valeur est
        # figée ici plutôt que laissée à une saisie.
        value: "true"
