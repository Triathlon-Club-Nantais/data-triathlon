# ┌────────────────────────────────────────────────────────────────────────────┐
# │ CE FICHIER N'EST PAS APPLIQUÉ. C'est une base de référence, pas la config. │
# └────────────────────────────────────────────────────────────────────────────┘
#
# Les deux services Render ont été créés **à la main**, pas depuis un Blueprint :
# Render ne lit donc jamais ce fichier, et la configuration qui fait foi est
# celle du dashboard (Settings de chaque service). Le décalage a un coût connu —
# c'est #162 : le `buildCommand` écrit ici prétendait produire un fichier
# `VERSION`, il n'a jamais tourné, et `GET /api/v1/version` répondait « dev » en
# production.
#
# Deux conséquences pratiques :
#
# - **toute modification ici est sans effet** tant que les services ne sont pas
#   rattachés à un Blueprint. La reporter dans le dashboard, sur les *deux*
#   services (docs/ci-cd.md, §Mise en place côté plateformes) ;
# - le contenu ci-dessous est tenu **aligné sur le réel là où c'est observable**,
#   faute de quoi il redevient le piège qu'il a été. Une réserve : `generateValue`
#   est une directive de Blueprint, pas un état de service — aucun n'ayant jamais
#   tourné, cette ligne décrit une intention (la clé a été saisie à la main).
#
# Le dépôt est public : aucun ID de service (`srv-…`) ni URL d'instance ici.
services:
  # PROD. `name` porte le nom **réel** du service : c'est par lui qu'un Blueprint
  # apparie un service existant, donc un nom approchant en créerait un troisième
  # au lieu d'adopter celui-ci. Il a justement porté `data-triathlon` — le nom du
  # dépôt, pas celui du service — jusqu'à #259 ; le service s'appelle
  # `triathlon-backend-production` (son *slug*, lui, est `data-triathlon-vq6u`,
  # d'où l'URL `.onrender.com` : un slug ne s'écrit pas dans un blueprint).
  - type: web
    name: triathlon-backend-production
    runtime: python
    autoDeploy: false # déploiement uniquement via deploy hook (gate CI)
    rootDir: backend
    region: frankfurt
    plan: free
    # Pas de génération de fichier `VERSION` ici : la version ne se déduit pas
    # côté Render. Le hook déploie la **branche** `main`, jamais le tag — un
    # `git describe` y rendrait au mieux `v0.1.4-63-gxxxxxxx`, au pire un SHA nu
    # si le clone Render n'embarque pas les tags. Elle est donc **poussée** par
    # `.github/workflows/deploy.yml` en variable `APP_VERSION` (voir plus bas),
    # depuis le seul endroit qui connaisse le tag.
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars: &backend_env_vars
      - key: DATABASE_URL
        sync: false
      # ── Version applicative (#134, #162) ───────────────────────────────────
      # Écrite **par le pipeline** avant chaque deploy hook, via l'API Render
      # (`PUT /v1/services/{id}/env-vars/APP_VERSION`) : Render déploie une
      # branche et ne connaît pas le tag, seul `deploy.yml` le connaît. Ne pas
      # la saisir à la main, elle serait écrasée au déploiement suivant.
      # Absente, `app/version.py` rend « dev » : le repli fichier `VERSION` a
      # été supprimé, il n'a jamais tourné (cf. l'en-tête de ce fichier).
      - key: APP_VERSION
        sync: false
      # ── Authentification SSO (#114) ────────────────────────────────────────
      # En `sync: false` — secrets, ou valeurs propres à l'environnement — à
      # **deux exceptions près**, chacune commentée ci-dessous : la clé de
      # signature (`generateValue`) et le drapeau de cookie (`value`). Ces trois
      # formes sont exclusives l'une de l'autre chez Render : une entrée porte
      # `sync: false` **ou** une source de valeur, jamais les deux.
      # Une variable absente n'empêche **pas** le démarrage — le site public
      # reste intact et aucun moyen de connexion n'est proposé (FR-036).
      # Valeurs par environnement : docs/ci-cd.md.
      - key: AUTH_SESSION_SECRET_KEY
        # `generateValue` et non `sync: false` : personne n'a besoin de connaître
        # cette clé, et la saisir à la main ferait transiter un secret par un
        # presse-papiers sans rien apporter. Régénérer ne ferme **aucune**
        # session — le jeton de session est opaque et vérifié en base, cette clé
        # ne signe que le jeton d'état (docs/ci-cd.md).
        generateValue: true # ≥ 32 caractères exigés, sinon le démarrage échoue
      - key: AUTH_GITHUB_CLIENT_ID
        sync: false
      - key: AUTH_GITHUB_CLIENT_SECRET
        sync: false
      # `AUTH_ALLOWED_EMAILS` **a été retirée ici** (#259) : la liste vit dans la
      # table `allowed_emails` depuis #170, et la reprise qui la lisait encore
      # (migration `a107b77b53e8`, livrée en v0.2.0) a été constatée dans
      # /admin/acces. Ne pas la réintroduire : `Settings` porte `extra="ignore"`,
      # elle serait ignorée en silence.
      - key: AUTH_REDIRECT_BASE_URL
        sync: false # origine de l'**interface** (Vercel), jamais celle de l'API
      - key: AUTH_COOKIE_SECURE
        # Seconde exception : ni secret ni propre à l'instance. Le nom des
        # cookies en **dérive** (`__Host-` exige `Secure`), donc la valeur est
        # figée ici plutôt que laissée à une saisie.
        value: "true"
      # ── Le reste de la référence (#259) ────────────────────────────────────
      # Ces cinq entrées manquaient : le fichier ne décrivait que la base, la
      # version et le SSO, ce qui en faisait une référence muette là où une
      # erreur coûte le plus cher (`GITHUB_BATCH_TARGET`).
      #
      # Origines autorisées à appeler l'API depuis un navigateur (CSV). Le défaut
      # du code (`app/core/config.py`) en tient **quatre** — `127.0.0.1` et
      # `localhost`, chacun en :3000 et :5173 : un navigateur les compte comme
      # des origines distinctes, et c'est `http://127.0.0.1:3000` que le parcours
      # SSO local prescrit (docs/ci-cd.md). Inutilisable en production,
      # et pourtant **sans symptôme** : l'interface proxifie `/api/*` par un
      # rewrite Next (`next.config.ts`), donc les appels partent en *same-origin*
      # et n'exercent jamais CORS. Constaté le 16/08/2026 : la production ne
      # renvoie aucun en-tête `Access-Control-Allow-*`. À saisir tout de même —
      # le jour où un appel direct existe, l'oubli tombe côté navigateur.
      - key: CORS_ORIGINS
        sync: false
      # Journalisation structurée (ingestion Render/Datadog). Mesuré le
      # 16/08/2026 sur les journaux de production : aucune sortie JSON, la
      # variable y est donc absente ou fausse. La ligne décrit cet état, elle ne
      # le change pas — la basculer se fait au dashboard.
      - key: LOG_JSON
        value: "false"
      # Documentation interactive (#399, constat A05-1 de l'audit OWASP) :
      # `/docs`, `/redoc` et `/openapi.json`. Le code **ferme** par défaut, donc
      # la production n'a rien à saisir — c'est la preview qui déclare son
      # ouverture (`true`) au dashboard. Le sens du défaut est délibéré : ce
      # fichier n'étant appliqué par personne, un défaut ouvert aurait fait
      # dépendre le correctif d'une saisie, et une saisie oubliée ne se voit pas.
      - key: DOCS_ENABLED
        sync: false
      - key: POSTHOG_PROJECT_TOKEN
        sync: false # vide = captures ignorées en silence, état légitime
      # ── Lancement des batches depuis /admin (#47) ──────────────────────────
      # Jeton *fine-grained*, ce dépôt seul, permission `actions: write`. Il
      # **expire** (un an au plus) : sa date de fin est suivie dans
      # docs/ci-cd.md, § Échéances des jetons.
      - key: GITHUB_BATCH_TOKEN
        sync: false
      # **La seule variable de ce fichier dont une erreur de saisie se voie chez
      # les adhérents** : elle nomme la base que les batches lancés depuis CETTE
      # instance écrivent — `production` ici, `preview` sur l'autre service.
      # L'inverser ferait écrire les batches de la preview en production. C'est
      # une propriété du déploiement, jamais un choix offert dans l'écran.
      - key: GITHUB_BATCH_TARGET
        sync: false

  # PREVIEW. Nom réel du service : `triathlon-backend-preview`. Même image, même
  # pipeline ; seules diffèrent les valeurs `sync: false` (base Supabase preview,
  # `AUTH_REDIRECT_BASE_URL` du projet Vercel preview). D'où l'ancre YAML sur les
  # variables plutôt qu'un second bloc à maintenir en double.
  - type: web
    name: triathlon-backend-preview
    runtime: python
    autoDeploy: false
    rootDir: backend
    region: frankfurt
    plan: free
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # `APP_VERSION` y reçoit un `git describe` (`v0.1.4-63-gxxxxxxx`) et non un
    # tag : une preview n'en porte pas.
    envVars: *backend_env_vars
