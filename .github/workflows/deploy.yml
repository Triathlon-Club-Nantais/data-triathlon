name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Déclenchement manuel d'une preview depuis l'onglet Actions
  # (« Run workflow » → choix de la branche de la PR).
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Déclaré explicitement plutôt qu'hérité du défaut du dépôt pour `GITHUB_TOKEN`
# (constat A08-3, docs/superpowers/specs/2026-08-16-securite-owasp-audit.md).
# Aucun step de ce fichier n'écrit avec ce jeton : Render et Vercel sont
# appelés avec leurs propres secrets (`RENDER_API_KEY`, `VERCEL_TOKEN`).
# `contents: read` couvre le seul besoin réel des trois jobs, `actions/checkout`.
permissions:
  contents: read

jobs:
  # Contrôles qualité (réutilise ci.yml) — aucun déploiement sans CI verte.
  ci:
    uses: ./.github/workflows/ci.yml

  # ---- PREVIEW : merge sur main OU déclenchement manuel d'une branche de PR ----
  deploy-preview:
    needs: ci
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: preview
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # Le checkout précède le hook Render : la version poussée au backend (#162)
      # se calcule par `git describe`, elle a donc besoin de l'arbre.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # `fetch-depth: 0` : `git describe --tags` a besoin de l'historique
          # complet pour trouver le tag le plus récent (le shallow clone par
          # défaut de checkout@v4 n'inclut ni tags ni commits antérieurs).
          fetch-depth: 0

      - name: Compute app version
        id: version
        # Ref courante en priorité (branche PR sur workflow_dispatch, ou main),
        # sinon `git describe` sur main. `--always` fallback sur SHA court.
        run: echo "value=$(git describe --tags --always 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"

      # Render déploie la **branche** `main` sur hook : il ne voit jamais le tag,
      # et son `buildCommand` réel est celui du dashboard, pas celui de
      # `render.yaml` — d'où le « dev » de #162. Ce workflow est le seul endroit
      # qui connaisse la version ; il alimente déjà le front, il alimente
      # désormais aussi le back, que `app/version.py` lit en priorité 1.
      #
      # Route **par clé** (`…/env-vars/APP_VERSION`) : le `PUT …/env-vars` nu
      # remplace *toutes* les variables du service, donc effacerait `DATABASE_URL`
      # et les secrets d'auth.
      #
      # L'ID de service est extrait du deploy hook (`…/deploy/srv-xxx?key=…`)
      # plutôt que stocké en secret séparé : on vise ainsi par construction le
      # service qu'on déploie, là où un second secret peut diverger. Le dépôt
      # étant public, aucun `srv-…` n'est écrit en clair (cf. docs/ci-cd.md).
      #
      # `jq --arg` construit le JSON : la version vient d'un nom de ref, elle
      # n'est jamais interpolée dans le shell ni concaténée à la main.
      - name: Render (backend) — injecte APP_VERSION
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PREVIEW }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          service_id=$(printf '%s' "$DEPLOY_HOOK" | sed -n 's#.*/deploy/\(srv-[^/?]*\).*#\1#p')
          [ -n "$service_id" ] || { echo "::error::ID de service introuvable dans le deploy hook"; exit 1; }
          # Le dépôt est public, donc ses logs Actions le sont. `service_id` est
          # une *sous-chaîne* d'un secret : GitHub ne masque que la valeur exacte,
          # pas ses fragments. Le garder hors du dépôt tout en l'imprimant ici
          # serait une distinction sans différence.
          echo "::add-mask::$service_id"
          # Reprise avant tout le reste : `render-sleep.yml` suspend ce service
          # (la preview à chaque heure pile entre deux déploiements — #560 —, la
          # production entre 1 h et 4 h UTC — #530), et un deploy hook envoyé à un
          # service suspendu ne le rallume pas. Ce `resume` n'a pas à craindre le
          # cron horaire qui suit : celui-ci s'abstient tant qu'un déploiement est
          # en vol ou vient de finir. C'est aussi le filet si le cron de lever
          # ne passe pas : un déploiement rallume toujours sa cible. Reprendre un
          # service déjà éveillé n'est pas une erreur ici — `--fail-with-body`
          # n'est pas armé sur cet appel, dont l'échec ne doit pas bloquer un
          # déploiement.
          curl -sS -X POST -H "Authorization: Bearer $RENDER_API_KEY" \
            --retry 3 --retry-delay 5 --retry-all-errors --max-time 60 \
            "https://api.render.com/v1/services/$service_id/resume" || true
          echo
          # `--fail-with-body` et non `-f` : sans lui, un 400 ne rend que
          # « curl: (22) … error: 400 », sans le motif renvoyé par Render. Le
          # corps n'est donc **pas** redirigé — c'est lui le diagnostic. En
          # succès il ne rend que la variable écrite, sans secret.
          jq -n --arg v "$APP_VERSION" '{value: $v}' | curl -sS --fail-with-body -X PUT \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            --retry 3 --retry-delay 5 --retry-all-errors --max-time 60 \
            --data @- "https://api.render.com/v1/services/$service_id/env-vars/APP_VERSION"
          echo
          echo "APP_VERSION=$APP_VERSION poussée"

      # `&ref=` : même raison qu'en production (voir ce job) — le backend déployé
      # doit être le commit dont `APP_VERSION` porte le `git describe`.
      #
      # Sur un `workflow_dispatch` depuis une branche de PR, l'**intention** est
      # de déployer ce commit-là et non `main`, sur laquelle le service est
      # épinglé. Non vérifié : Render documente `ref` pour un SHA, sans dire si
      # un commit hors branche liée est résolvable. À confirmer par un dispatch
      # manuel avant de s'y fier.
      #
      # `--fail-with-body` et non `-f`, même raison qu'à l'étape env-var :
      # le hook ne rend pas 200 quoi qu'il arrive — il rend 409 quand le
      # service est suspendu ou qu'un déploiement est déjà en cours, et `-f`
      # avalait le motif (constaté du 22 au 23/08/2026, quatre jours de CI
      # rouge sans autre diagnostic que « error: 409 »).
      - name: Render (backend) — deploy hook preview
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PREVIEW }}
        run: curl -sSL --fail-with-body -X POST --retry 3 --retry-delay 5 --retry-all-errors --max-time 60 "$DEPLOY_HOOK&ref=${{ github.sha }}"

      # `vercel build` tourne **sur ce runner** (le déploiement se fait ensuite
      # en `--prebuilt`) : c'est donc ici le runtime de build réel du front, à
      # tenir aligné sur celui de `ci.yml`, sans quoi la CI valide autre chose
      # que ce qui est livré.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "26"

      - run: npm i -g vercel@54 # major épinglé : évite qu'une release Vercel casse le pipeline

      - name: Vercel (frontend) — preview
        # Pas de working-directory : le Root Directory (frontend) est déjà configuré côté projet Vercel.
        # `NEXT_PUBLIC_APP_VERSION` est lu par `VersionFooter` (#134) et embarqué au build.
        #
        # `--prod` **et** `--environment=production` visent le projet Vercel
        # `data-triathlon-preview` (#172) : le `VERCEL_PROJECT_ID` de l'environment
        # GitHub `preview` surcharge celui du dépôt. C'est donc la production de ce
        # second projet — son domaine stable —, dont les variables pointent vers le
        # backend Render preview. Un preview deployment change d'URL à chaque
        # exécution, ce qui interdit toute URL de retour SSO enregistrée.
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_APP_VERSION: ${{ steps.version.outputs.value }}

  # ---- PRODUCTION : tag v* ----
  deploy-production:
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Compute app version
        id: version
        # Sur un push de tag, `github.ref_name` est directement le tag (`v0.1.3`).
        # `git describe` marche aussi mais on privilégie la source explicite.
        #
        # Par `env:` et jamais interpolé dans le `run:` : un nom de ref git
        # autorise `` ` ``, `$`, `;`, `&`, `|` — un tag `v1;curl …` exécuterait du
        # shell dans ce job, qui porte `RENDER_API_KEY`, un accès en écriture à
        # tout le workspace Render. `github.sha` reste interpolé tel quel, c'est
        # de l'hexadécimal immuable.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "value=$REF_NAME" >> "$GITHUB_OUTPUT"

      # Même injection qu'en preview (#162) — raisonnement complet dans ce job.
      # Avant le hook : Render fige les variables au démarrage du déploiement.
      - name: Render (backend) — injecte APP_VERSION
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PROD }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          service_id=$(printf '%s' "$DEPLOY_HOOK" | sed -n 's#.*/deploy/\(srv-[^/?]*\).*#\1#p')
          [ -n "$service_id" ] || { echo "::error::ID de service introuvable dans le deploy hook"; exit 1; }
          # Le dépôt est public, donc ses logs Actions le sont. `service_id` est
          # une *sous-chaîne* d'un secret : GitHub ne masque que la valeur exacte,
          # pas ses fragments. Le garder hors du dépôt tout en l'imprimant ici
          # serait une distinction sans différence.
          echo "::add-mask::$service_id"
          # Reprise avant tout le reste : `render-sleep.yml` suspend ce service
          # (la preview à chaque heure pile entre deux déploiements — #560 —, la
          # production entre 1 h et 4 h UTC — #530), et un deploy hook envoyé à un
          # service suspendu ne le rallume pas. Ce `resume` n'a pas à craindre le
          # cron horaire qui suit : celui-ci s'abstient tant qu'un déploiement est
          # en vol ou vient de finir. C'est aussi le filet si le cron de lever
          # ne passe pas : un déploiement rallume toujours sa cible. Reprendre un
          # service déjà éveillé n'est pas une erreur ici — `--fail-with-body`
          # n'est pas armé sur cet appel, dont l'échec ne doit pas bloquer un
          # déploiement.
          curl -sS -X POST -H "Authorization: Bearer $RENDER_API_KEY" \
            --retry 3 --retry-delay 5 --retry-all-errors --max-time 60 \
            "https://api.render.com/v1/services/$service_id/resume" || true
          echo
          # `--fail-with-body` et non `-f` : sans lui, un 400 ne rend que
          # « curl: (22) … error: 400 », sans le motif renvoyé par Render. Le
          # corps n'est donc **pas** redirigé — c'est lui le diagnostic. En
          # succès il ne rend que la variable écrite, sans secret.
          jq -n --arg v "$APP_VERSION" '{value: $v}' | curl -sS --fail-with-body -X PUT \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            --retry 3 --retry-delay 5 --retry-all-errors --max-time 60 \
            --data @- "https://api.render.com/v1/services/$service_id/env-vars/APP_VERSION"
          echo
          echo "APP_VERSION=$APP_VERSION poussée"

      # `&ref=` épingle le déploiement au **commit taggé**. Sans lui le hook
      # déploie le HEAD de `main` (le service est épinglé sur cette branche) :
      # `APP_VERSION` annoncerait `v0.1.4` sur du code qui n'est pas ce tag —
      # un affichage faux, pire que le « dev » de #162. C'était l'état constaté,
      # la prod tournant 63 commits après `v0.1.4`.
      # Le hook porte déjà `?key=…`, d'où `&` et non `?`.
      - name: Render (backend) — deploy hook prod
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PROD }}
        run: curl -sSL --fail-with-body -X POST --retry 3 --retry-delay 5 --retry-all-errors --max-time 60 "$DEPLOY_HOOK&ref=${{ github.sha }}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # `git describe` a besoin des tags (cf. job preview)

      # `vercel build` tourne **sur ce runner** (le déploiement se fait ensuite
      # en `--prebuilt`) : c'est donc ici le runtime de build réel du front, à
      # tenir aligné sur celui de `ci.yml`, sans quoi la CI valide autre chose
      # que ce qui est livré.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "26"

      - run: npm i -g vercel@54 # major épinglé : évite qu'une release Vercel casse le pipeline

      - name: Vercel (frontend) — production
        # Pas de working-directory : le Root Directory (frontend) est déjà configuré côté projet Vercel.
        # `NEXT_PUBLIC_APP_VERSION` est lu par `VersionFooter` (#134) et embarqué au build.
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_APP_VERSION: ${{ steps.version.outputs.value }}
