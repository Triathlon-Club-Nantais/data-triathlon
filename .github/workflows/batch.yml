# Batches de production — re-scrape de la base, ou import d'une liste d'URL.
#
# Ce workflow n'est pas de l'intégration continue : il détient la base de
# **production** et exécute ce que l'interface d'administration lui demande
# (#47). Il se relit comme du code de production.
#
# Deux règles à ne jamais relâcher :
#
#   1. **Aucune entrée n'est interpolée dans un `run:`.** `${{ inputs.x }}` est
#      substitué *avant* le shell : une valeur contenant `"; curl … | sh #`
#      s'exécuterait avec l'accès à la base. Chaque valeur transite par `env:` et
#      n'est lue que citée (`"$X"`). Vérification : aucun `inputs.` ne doit
#      apparaître dans un bloc `run:` de ce fichier.
#   2. **La séparation stdout/stderr de la CLI est le contrat** dont dépendent
#      les deux sorties : avec `--json`, stdout ne porte *que* la ligne JSON
#      (elle devient l'artefact), le rapport texte passe sur stderr (il devient
#      le résumé). Capturer les deux flux ensemble casserait l'artefact.
#
# Contrat complet : specs/20260806-143754-ops-batch-runs/contracts/workflow.md
name: Batch

run-name: "batch · ${{ inputs.target || 'production' }} · ${{ inputs.mode }} · ${{ inputs.correlation_id }}"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Base visée"
        type: choice
        options: [preview, production]
        # Défaut **preview**, et c'est délibéré : un lancement manuel distrait
        # ne doit pas écrire dans la base des adhérents. La production se
        # demande, elle ne s'obtient pas par inattention.
        default: preview
      mode:
        description: "Sélection des épreuves : filtres sur la base, ou liste d'URL"
        type: choice
        options: [rescrape, urls]
        default: rescrape
      provider:
        description: "Chronométreur (mode rescrape) — vide = tous"
        type: string
        default: ""
      older_than:
        description: "Épreuves non rafraîchies depuis N jours (mode rescrape)"
        type: string
        default: ""
      limit:
        description: "Nombre maximum d'épreuves"
        type: string
        default: ""
      urls:
        description: "Une URL par ligne (mode urls)"
        type: string
        default: ""
      dry_run:
        description: "Simulation : ne scrape rien, ne persiste rien"
        type: boolean
        default: false
      correlation_id:
        description: "Identifiant de corrélation posé par l'appelant"
        type: string
        default: ""

# Le verrou réel : deux batches concurrents sur la **même base** sont un
# incident, pas une file d'attente. Il vaut aussi pour un lancement fait depuis
# l'onglet Actions ou par la planification, que le refus 409 de l'API ne voit pas.
#
# Le groupe porte la cible : preview et production sont deux bases distinctes,
# et faire attendre l'une pendant que l'autre travaille n'aurait aucun sens.
#
# `|| 'production'` : une exécution **planifiée** ne porte aucune entrée, et son
# `inputs.target` est vide. Sans ce repli, le cron nocturne hériterait du défaut
# `preview` et ne rafraîchirait jamais la base réelle — une panne silencieuse,
# du genre qu'on ne découvre qu'en cherchant pourquoi les résultats datent.
concurrency:
  group: batch-${{ inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # `id-token: write` est requis pour l'échange OIDC vers Azure (#243). Sans
    # cette ligne, `azure/login@v2` échoue à récupérer le jeton fédéré et le
    # batch n'atteint jamais son premier `run:`.
    permissions:
      id-token: write
      contents: read
    # Sans cette borne, une exécution coincée gèlerait tout nouveau lancement
    # six heures durant (défaut de la plateforme). Une reprise complète tient
    # très largement dans deux heures.
    timeout-minutes: 120
    # Un environment par base — `batch-preview` ou `batch-production` —, chacun
    # portant son `DATABASE_URL`. C'est lui, et lui seul, qui décide de la base
    # écrite : rien dans le script ne la nomme.
    #
    # Environments **dédiés**, et non `Preview`/`Production` : ces derniers ne
    # portent aucune `DATABASE_URL` (l'URL vit côté Render), et `Production`
    # porte une *required reviewer* qui laisserait chaque batch en attente d'une
    # approbation humaine. Le contrôle d'accès est le pouvoir `batch:run`, côté
    # API. Cf. docs/ci-cd.md.
    #
    # Même repli que la concurrence : sans entrée (planification), c'est la
    # production.
    environment: batch-${{ inputs.target || 'production' }}
    defaults:
      run:
        working-directory: backend
    # Le contexte `secrets` n'existe **pas** dans un `if:` de step : l'y écrire
    # rend le fichier illisible par la plateforme, et l'exécution échoue au
    # démarrage, avant le moindre step (constaté sur les runs 31162084006,
    # 31162684474 et 31163082539). Recopié ici, il devient lisible par le
    # contexte `env`, lui autorisé dans un `if:`.
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # Authentification Azure par OIDC (#243) — aucun secret long-lived. Le
      # federated credential côté Azure lie ce jeton à l'environment déclaré
      # par le job. La cible `preview`, qui n'écrit pas sur Azure, ne fournit
      # pas ce secret : le step est conditionné à sa présence, et le suivant
      # (`Open Azure firewall`) ne tourne que si celui-ci a réussi.
      - name: Azure login (production only)
        id: azure_login
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Ouverture *just-in-time* du pare-feu Azure : les runners GHA hébergés
      # n'ont pas d'IP stable, et le range publié par GitHub couvre plusieurs
      # milliers d'adresses — trop large pour un allowlist statique. La règle
      # porte le `run_id`, ce qui la rend imputable à une exécution précise ;
      # elle est retirée par le step de fin de job en `if: always()`, y compris
      # sur échec du batch. Cf. `docs/infra-azure.md` pour la convention de
      # nommage.
      - name: Open Azure firewall (production only)
        id: firewall
        if: steps.azure_login.outcome == 'success'
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          SERVER: ${{ secrets.AZURE_POSTGRES_SERVER }}
        run: |
          set -euo pipefail
          RUNNER_IP=$(curl -sSf https://api.ipify.org)
          RULE_NAME="gh-batch-${GITHUB_RUN_ID}"
          echo "rule_name=$RULE_NAME" >> "$GITHUB_OUTPUT"
          az postgres flexible-server firewall-rule create \
            --resource-group "$RG" --server-name "$SERVER" \
            --name "$RULE_NAME" \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" \
            --only-show-errors --output none

      - name: Run batch
        id: batch
        env:
          # `DATABASE_URL` doit viser un hôte IPv4 : les runners GitHub n'ont
          # pas d'IPv6. Sur Supabase (preview), c'est le pooler
          # (`…pooler.supabase.com`), pas `db.<ref>.supabase.co` qui résout en
          # IPv6 seule. Sur Azure PostgreSQL Flexible (production), le FQDN
          # résout déjà en IPv4 — mais l'accès nécessite qu'une règle firewall
          # autorise l'IP du runner, posée par le step précédent. Symptôme d'un
          # mauvais hôte : échec de connexion réseau, sans rapport apparent
          # avec le code. Cf. docs/ci-cd.md.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODE: ${{ inputs.mode }}
          PROVIDER: ${{ inputs.provider }}
          OLDER_THAN: ${{ inputs.older_than }}
          LIMIT: ${{ inputs.limit }}
          URLS: ${{ inputs.urls }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail

          args=(--json --no-progress)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi

          # `--no-progress` et non `--plain` : la progression et le rapport
          # partagent stderr, et le résumé ne doit porter que le rapport. Le
          # suivi pas-à-pas se fait dans l'écran d'administration, pas ici.
          set +e
          if [ "$MODE" = "urls" ]; then
            printf '%s\n' "$URLS" \
              | uv run python -m app.cli rescrape-db "${args[@]}" --urls-from - \
                  > bilan.json 2> rapport.txt
          else
            if [ -n "$PROVIDER" ]; then args+=(--provider "$PROVIDER"); fi
            if [ -n "$OLDER_THAN" ]; then args+=(--older-than "$OLDER_THAN"); fi
            uv run python -m app.cli rescrape-db "${args[@]}" \
              > bilan.json 2> rapport.txt
          fi
          code=$?
          set -e

          cat rapport.txt
          exit $code

      # `always()` : un échec total (code 1) est un résultat, pas une panne — son
      # bilan est précisément ce qu'on vient lire.
      - name: Write summary
        if: always()
        run: |
          {
            echo '## Bilan'
            echo '```'
            # `$GITHUB_STEP_SUMMARY` est refusé **en entier** au-delà de 1 Mo :
            # le rapport n'est pas tronqué, il disparaît (constaté sur le run
            # 31202351491, 1029 Ko — le journal de scraping d'une seule épreuve
            # suffit). On n'en garde donc que la fin, celle qui porte le bilan ;
            # le rapport entier part dans l'artefact, à côté du bilan JSON.
            tail -c 200000 rapport.txt 2>/dev/null || echo '(aucun rapport : la CLI ne s’est pas exécutée)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilan-${{ inputs.correlation_id || github.run_id }}
          path: backend/bilan.json
          if-no-files-found: warn
          retention-days: 90

      # Artefact **séparé**, et non un second fichier dans le précédent : le
      # contrat de lecture du bilan est « le zip ne porte qu'une entrée, elle est
      # le JSON » (`contracts/workflow.md`). Le rapport texte n'a de lecteur
      # qu'humain, et c'est le seul endroit où il survit entier depuis que le
      # résumé n'en montre que la fin.
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-${{ inputs.correlation_id || github.run_id }}
          path: backend/rapport.txt
          if-no-files-found: warn
          retention-days: 90

      # Retirer la règle firewall même quand le batch a échoué — sinon on laisse
      # une IP dans l'allowlist. Le garde sur `steps.firewall.outputs.rule_name`
      # évite d'appeler `az` quand le step d'ouverture n'a pas produit de sortie
      # (login KO, run en preview, etc.). `|| true` sur `delete` : une règle
      # déjà supprimée manuellement n'est pas un incident.
      - name: Close Azure firewall
        if: always() && steps.firewall.outputs.rule_name != ''
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          SERVER: ${{ secrets.AZURE_POSTGRES_SERVER }}
          RULE_NAME: ${{ steps.firewall.outputs.rule_name }}
        run: |
          set -uo pipefail
          az postgres flexible-server firewall-rule delete \
            --resource-group "$RG" --server-name "$SERVER" \
            --name "$RULE_NAME" --yes \
            --only-show-errors --output none || true
