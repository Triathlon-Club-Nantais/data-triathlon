name: CI

on:
  pull_request:
  # La merge queue de `main` rejoue la CI sur le commit de fusion et n'attend que
  # le check requis `ci-ok` du ruleset (#920). Sans ce déclencheur, aucun run
  # `merge_group` ne naît et la queue fusionnait sans jamais attendre la CI.
  merge_group:
  workflow_call:
  # Relance manuelle depuis l'onglet Actions (« Run workflow » → choix de la
  # branche) : `pull_request` ne se redéclenche pas tout seul quand l'exécution
  # a été manquée (interruption GitHub, workflow ajouté après l'ouverture de la
  # PR, checks jamais rapportés). Le job tourne alors sur la branche choisie, pas
  # sur la fusion ; c'est le run `merge_group` de la queue qui valide la fusion.
  workflow_dispatch:

# Déclaré explicitement plutôt qu'hérité du défaut du dépôt pour `GITHUB_TOKEN`
# (constat A08-3, docs/superpowers/specs/2026-08-16-securite-owasp-audit.md) :
# `pull_request` exécute du code de contributeur. Aucun step d'aucun job ne
# pousse de commit, ne commente une PR ni ne crée de check run — `contents:
# read` couvre le seul besoin réel, `actions/checkout`.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --locked : échoue si uv.lock n'est pas à jour avec pyproject.toml.
      # C'est le garde-fou qui empêche une dépendance ajoutée sans lock de passer en revue.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests (hors réseau)
        run: uv run pytest -m "not integration"

  # uv audit interroge OSV sur le uv.lock résolu : aucune dépendance de dev
  # supplémentaire (contrairement à pip-audit), en écho au Principe de
  # conception « s'appuyer d'abord sur les dépendances déjà présentes ».
  # Commande expérimentale côté uv (--preview-features tait juste l'avertissement,
  # ne change pas le comportement).
  #
  # Job à part, hors de `ci-ok` et en `continue-on-error` (#920) : une advisory
  # publiée après coup rendait toutes les PR rouges, y compris les bumps
  # Dependabot qui la corrigent, et bloquait la merge queue. Le job reste rouge
  # et visible sur la PR (constat A06-1 de l'audit OWASP, #397), sans rien bloquer.
  backend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Audit des dépendances (uv audit)
        run: uv audit --locked --preview-features audit-command

  # Le moteur de production (#947) : la suite unitaire tourne sur SQLite, et un
  # `create_all` masque toute dérive entre modèles et migrations. Ce job joue la
  # chaîne Alembic complète sur PostgreSQL 16 (`pg_trgm` et `unaccent` sont dans
  # l'image officielle), puis les repositories, seule couche qui construit du SQL.
  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: triathlon
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/triathlon
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Migrations (upgrade, check, downgrade, upgrade)
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade -1
          uv run alembic upgrade head

      # Base distincte : les fixtures montent et démontent leur schéma par
      # `create_all`, elles effaceraient celui que la migration vient de poser.
      # `-n 0` : les workers partageraient la même base.
      - name: Repositories sur PostgreSQL
        env:
          PGPASSWORD: postgres
          TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/triathlon_tests
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE triathlon_tests"
          uv run pytest tests/test_repositories -m "not integration" -n 0

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Alignée sur la version de développement. Node 20 divergeait assez pour
      # rendre des tests verts en local et rouges ici : `window.localStorage`
      # est fourni à jsdom sur 20, pas sur 26 (constaté sur #213).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Cache de compilation Next (Turbopack l'écrit dans `.next/cache`) : sans
      # lui, chaque build repart à froid, « No build cache found » (#1074).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: frontend/.next/cache
          key: nextjs-ci-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.[jt]s', 'frontend/**/*.[jt]sx', '!frontend/node_modules/**') }}
          restore-keys: |
            nextjs-ci-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      # Miroir de `uv audit` côté backend, borné au runtime : une alerte sur
      # l'outillage de dev (eslint, shadcn) ne bloque pas une PR (#1022).
      - name: Audit des dépendances (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck + build
        run: npm run build # next build = typecheck TS strict + RSC

  # Job à part, en matrice : les tests dominaient le job frontend (117 s sur ~178 s,
  # mesuré sur #670) parce que le runner CI a moins de cœurs qu'un poste de dev — le
  # goulot n'est pas le nombre de fichiers mais le coût d'instanciation de jsdom
  # (~650 ms/fichier), et deux pistes de config seule ont été essayées et rejetées :
  # `isolate: false` bloque la suite (état jsdom partagé entre fichiers), `pool:
  # "threads"` est 3x plus lent (plusieurs jsdom sur un seul tas V8). Le sharding
  # `--shard=N/M` de vitest répartit les fichiers de test sur des runners séparés,
  # donc réellement parallèles plutôt qu'en contention sur les mêmes cœurs.
  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests (vitest, shard ${{ matrix.shard }})
        run: npm test -- --shard=${{ matrix.shard }}

  # Seul check requis par le ruleset de `main` (#920). Un agrégateur plutôt que
  # la liste des jobs : renommer un job ou changer la matrice des shards ne casse
  # pas la règle. `if: always()` : sans lui, un job amont en échec le ferait
  # sauter, et un check sauté compte comme réussi pour la merge queue.
  ci-ok:
    if: always()
    needs: [backend, backend-postgres, frontend, frontend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tous les jobs requis ont réussi
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Résultats : $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
