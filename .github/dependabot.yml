# Mises à jour de version Dependabot (#401, constat A06-2 de l'audit OWASP :
# docs/superpowers/specs/2026-08-16-securite-owasp-audit.md).
#
# Les alertes de sécurité Dependabot sont déjà actives sur ce dépôt ; ce
# fichier ajoute les PR de montée de version proprement dites, sur les trois
# écosystèmes présents : backend Python (uv), frontend npm, et les GitHub
# Actions des workflows.
#
# Cadence mensuelle : le dépôt est tenu par une poignée de personnes, et un
# Dependabot hebdomadaire qu'on cesse de lire ne vaut pas mieux que pas de
# Dependabot. Les mises à jour mineures/correctives sont groupées en une seule
# PR par écosystème pour limiter le bruit de revue ; les montées majeures
# restent séparées pour une revue au cas par cas. Le backend en compte deux :
# les deux dépendances déclarées avec extras ne peuvent pas rejoindre un groupe
# qui filtre par `update-types` (raison mesurée sous `backend-extras`).

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      backend-minor-patch:
        update-types:
          - "minor"
          - "patch"
      # `fastapi[standard]` et `uvicorn[standard]` échappaient au groupe
      # ci-dessus, une PR isolée chacune par salve (#418, #419) : le parser uv
      # nomme l'entrée du manifeste avec ses extras et celle du lock sans
      # (`uvicorn[standard]` contre `uvicorn`), les deux ne fusionnent jamais,
      # et la dépendance arrive donc **sans version résolue** — un `>=` n'en
      # fournit aucune, seul un `==` le ferait. Or le filtre `update-types` a
      # besoin de comparer deux versions : sans version, il rejette la
      # dépendance du groupe. Ce second groupe, défini par motif et **sans**
      # `update-types`, les capte ; leurs majeures y sont donc groupées, ce qui
      # reste une revue de deux paquets couplés. Ni `patterns: ["*"]` ni un
      # plancher aligné sur le lock n'y changent quoi que ce soit (#431).
      backend-extras:
        patterns:
          - "fastapi*"
          - "uvicorn*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
