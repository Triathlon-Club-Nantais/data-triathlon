[project]
name = "data-triathlon-backend"
version = "0.1.0"
description = "API FastAPI des résultats de compétition du Triathlon Club Nantais"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "psycopg2-binary>=2.9.10",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "typer>=0.27.1",
    "rich>=15.0.0",
    # Flux OAuth du socle d'authentification (#114). `httpx_client.OAuth2Client`
    # hérite de `httpx.Client`, donc le transport gardé de `core/http` y descend
    # nativement — c'est ce qui fait passer tout le trafic OAuth par le contrôle
    # de destination (#101). Apporte `cryptography` et `joserfc` en transitif ;
    # `joserfc` signe le jeton d'état. Sondage : docs/superpowers/specs/2026-08-01-auth-librairies-sondage.md
    "authlib>=1.7.2",
    # Lecture des classeurs `.xlsx` téléversés dans l'écran d'administration
    # (#47). Le `.csv` reste à la stdlib ; c'est la seule brique qui manquait.
    "openpyxl>=3.1.5",
    "posthog>=7.39.1",
    # Parsing XML des flux de chronométrage (timepulse, wiclax) : `xml.etree` se
    # laisse saturer par une bombe d'entités, defusedxml est le drop-in qui les
    # refuse (constat ruff S314, #394).
    "defusedxml>=0.7.1",
]

# PEP 735 : installé par `uv sync`, écarté par `uv sync --no-dev` (Render, Docker).
[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-xdist>=3.8.0",
    "respx>=0.21.1",
    "ruff>=0.16.3",
]

[tool.uv]
# Le backend est une application, pas une bibliothèque : rien à builder,
# aucune installation editable. `pythonpath = ["."]` ci-dessous suffit aux tests.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# `-v` coûtait 19 s sur 3656 tests (20 % de la suite), sortie redirigée — et
# davantage dans un terminal qui doit rendre 3656 lignes.
#
# `-n 4` et non `auto` : le plateau xdist est **plat** de 4 à 12 workers (44 à
# 49 s), donc la valeur ne se choisit pas sur la vitesse. 4 workers laissent
# 8 cœurs libres et n'entrent pas dans le régime de saturation qui a produit une
# erreur à n=12 ; et sur le runner CI à 4 vCPU, `-n 4` et `auto` coïncident.
#
# Le prix : ~1,35 s de démarrage sur une **exécution ciblée** (0,40 s → 1,75 s
# pour un seul fichier). `-n 0` le rend, et rétablit au passage `--pdb` et une
# sortie non entrelacée. Mesures : docs/superpowers/specs/2026-08-20-suites-de-tests-sondage.md
addopts = "-n 4"
markers = [
    "integration: tests nécessitant un accès réseau réel (pytest -m integration)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Les migrations sont autogénérées par Alembic — hors périmètre du lint.
exclude = ["alembic/versions"]

[tool.ruff.lint]
# `S` = flake8-bandit, le SAST embarqué dans ruff (#394) : il complète CodeQL
# côté code plutôt que côté flux, sans dépendance ni job de CI en plus.
select = ["E", "F", "I", "W", "UP", "B", "N", "S"]
ignore = [
    "E501",  # longueur de ligne gérée par le formateur
    "B008",  # Depends(...) en argument par défaut = motif idiomatique FastAPI
]

[tool.ruff.lint.per-file-ignores]
# Les tests ne sont pas une frontière de confiance : `assert` y est l'outil (5347
# occurrences), les mots de passe y sont factices et le XML y vient de fixtures.
"tests/**" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# Le dossier `alembic/` fait prendre le paquet tiers `alembic` pour du code local,
# ce qui scindait `from alembic import command` de `from alembic.config import Config`.
known-third-party = ["alembic"]
